    body {
      padding: .5em;

      .title {

    }

    .ibm-plex-serif-regular {

<body class="ibm-plex-serif-regular">

<div class="header">
  <h1>
    <a href="/" title="szabi.blog" class="title"><span class="ibm-plex-serif-medium">szabi.</span><span class="ibm-plex-serif-light">blog</span></a>
  </h1> 
</div>

<div class="content-wrapper">

  <div class="content">
    <div class="pure-g">
      <div class="pure-u-1"> ... </div>
    </div>
  </div>

</div>

<script>
function convertUrlsToLinks(text) {
  // Regular expression to match HTTP and HTTPS URLs, excluding trailing punctuation
  const urlPattern = /(https?:\/\/[^\s.]+)([.,;!?]?)\s*/g;
  return text.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
}

function convertAllTextNodes() {
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
  let node;

  while (node = walker.nextNode()) {
   const parent = node.parentNode;
   const newHtml = convertUrlsToLinks(node.nodeValue);
   if (newHtml !== node.nodeValue) {
     const newNode = document.createElement('span');
     newNode.innerHTML = newHtml;
     parent.replaceChild(newNode, node);
   }
  }
}

window.onload = convertAllTextNodes;
</script>
  
</body>
</html>
