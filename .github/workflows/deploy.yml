name: Deploy to musings

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy index file to server
        run: |
          scp -o StrictHostKeyChecking=no index.html ${{ secrets.SSH_USER_SERVER }}:/var/www/szabi.blog/public/
          ssh ${{ secrets.SSH_USER_SERVER }} bash -c "chown www-data:www-data /var/www/szabi.blog/public/index.html"
